name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tests/contract/requirements.txt
            services/gateway/requirements.txt
            tests/integration/requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install \
            -r tests/contract/requirements.txt \
            -r services/gateway/requirements.txt \
            -r tests/integration/requirements.txt
      - name: Run contract, integration, and security tests
        run: pytest tests/contract tests/integration tests/security
