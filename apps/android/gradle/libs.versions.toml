# 全部使用精确版本，不用范围、不用 "+"、不追踪上游 main（PRD 第 15.4 节：依赖锁定）。
# 本地转录引擎 sherpa-onnx 不在这里：它是预编译 AAR，版本与 SHA-256 固定在 engine/sherpa-onnx.properties，
# 构建时由 verifySherpaAar 任务校验。
[versions]
agp = "8.8.0"
kotlin = "2.0.21"
kotlinx-serialization-json = "1.7.3"
# 1.9.0 由 Kotlin 2.0.0 构建，与本工程的 Kotlin 2.0.21 同一代
kotlinx-coroutines = "1.9.0"
junit = "4.13.2"
androidx-test-core = "1.6.1"
androidx-test-runner = "1.6.2"
androidx-test-rules = "1.6.1"
androidx-test-ext-junit = "1.2.1"
# Compose 三件套（ui / foundation / material3）与 Compose BOM 2024.11.00 同一批：1.7.5 / 1.7.5 / 1.3.1
compose-ui = "1.7.5"
compose-material3 = "1.3.1"
androidx-activity = "1.9.3"
androidx-lifecycle = "2.8.7"
# Ticket 21：扫配对二维码。ZXing core 3.5.4（Apache-2.0；jar 610364 字节，SHA-256 71de5d89341b5fcf5dd89da7f44e84d825d0e084cdf3ec77c9abe26b0f0ceb13，
# 记录在 execution/acceptance/android-sync/README.md 的依赖固定表）与 CameraX 1.4.1（Apache-2.0）
zxing-core = "3.5.4"
androidx-camera = "1.4.1"
# 模型包是 .tar.bz2（Ticket 20，:modelmgmt）：JDK 与 Android 都没有 bzip2 解码。commons-io 与 commons-lang3 是 compress 1.28.0 POM 里的必需依赖，
# 这里写成与它的 POM 完全相同的精确版本，免得构建悄悄解析成别的版本；三个 jar 的 SHA-256 固定在 :modelmgmt 的 DependencyPinTest 里。
commons-compress = "1.28.0"
commons-io = "2.20.0"
commons-lang3 = "3.18.0"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidx-test-rules" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose-ui" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose-ui" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose-material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing-core" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "androidx-camera" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "androidx-camera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "androidx-camera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "androidx-camera" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
